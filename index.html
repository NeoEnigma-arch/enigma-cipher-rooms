<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Enigma Cipher Rooms – Download</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #00ff41;
      --muted: #6a9a72;
      --card: #111;
      --border: #1a3d22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Consolas, "Courier New", ui-monospace, monospace;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      line-height: 1.45;
    }
    .wrap {
      width: 100%;
      max-width: 26rem;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 1.4rem 1.25rem 1.5rem;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.08);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.1rem;
    }
    .sator {
      display: grid;
      gap: 0.05rem;
      justify-content: center;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.35em;
      margin: 0.75rem 0 1.25rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0d0d0d;
      user-select: none;
    }
    .sator span { padding-left: 0.35em; }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: #0a0a0a;
      background: var(--fg);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.95rem 1rem;
      border-radius: 10px;
      margin: 0.5rem 0;
    }
    a.btn:active { filter: brightness(0.9); }
    a.secondary {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.65rem;
    }
    ol {
      margin: 1.1rem 0 0;
      padding-left: 1.2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    ol li { margin: 0.35rem 0; }
    ol strong { color: var(--fg); }
    .status {
      min-height: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Enigma Cipher Rooms</h1>
    <p class="sub">Android · ohne Play Store · v1.0.11</p>

    <div class="sator" aria-hidden="true">
      <span>SATOR</span>
      <span>AREPO</span>
      <span>TENET</span>
      <span>OPERA</span>
      <span>ROTAS</span>
    </div>

    <!-- Direkter Tap: zuverlässiger als Auto-Download in QR-WebViews -->
    <a class="btn" id="dl"
       href="https://github.com/NeoEnigma-arch/enigma-cipher-rooms/releases/download/v1.0.11/Enigma-Cipher-Rooms-1.0.11.apk"
       download="Enigma-Cipher-Rooms-1.0.11.apk">
      APK herunterladen
    </a>
    <a class="secondary"
       href="https://github.com/NeoEnigma-arch/enigma-cipher-rooms/releases/latest">
      Alle Versionen auf GitHub
    </a>

    <ol>
      <li>Oben auf <strong>APK herunterladen</strong> tippen</li>
      <li>Datei in <strong>Downloads</strong> öffnen</li>
      <li>Bei Google/Xiaomi-Warnung: Scan abwarten / trotzdem installieren</li>
      <li>App starten</li>
    </ol>
    <p class="status" id="status"></p>
  </main>
  <script>
    // Sanfter Auto-Hinweis – kein aggressiver Auto-Download (viele Scanner blocken den)
    (function () {
      var status = document.getElementById('status');
      var isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        status.textContent = 'Tippe den grünen Button – dann startet der Download.';
      } else {
        status.textContent = 'Am besten auf dem Android-Handy öffnen.';
      }
    })();
  </script>
</body>
</html>
